name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect version bump
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            PREVIOUS=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          else
            PREVIOUS=""
          fi

          echo "previous=${PREVIOUS}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS:-<none>}"
          echo "current=$CURRENT"

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version bump detected: ${PREVIOUS:-<none>} → $CURRENT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($CURRENT); skipping release."
          fi

      - name: Build release notes
        if: steps.version.outputs.changed == 'true'
        id: notes
        run: |
          CURRENT_TAG="v${{ steps.version.outputs.current }}"
          PREVIOUS="${{ steps.version.outputs.previous }}"
          PREVIOUS_TAG=""
          RANGE=""

          if [ -n "$PREVIOUS" ]; then
            PREVIOUS_TAG="v${PREVIOUS}"
          fi

          if [ -n "$PREVIOUS_TAG" ] && git rev-parse --verify "refs/tags/${PREVIOUS_TAG}" >/dev/null 2>&1; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          elif PREV_RELEASE_TAG=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null); then
            RANGE="${PREV_RELEASE_TAG}..HEAD"
            PREVIOUS_TAG="$PREV_RELEASE_TAG"
          else
            RANGE="-20"
          fi

          {
            echo "## 更新内容"
            echo ""
            if [ "$RANGE" = "-20" ]; then
              git log --pretty=format:'- %s (%h)' -20
            else
              git log --pretty=format:'- %s (%h)' "$RANGE"
            fi
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              echo ""
              echo "**完整变更:** https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${CURRENT_TAG}"
            fi
          } > release-notes.md

          echo "Wrote release notes:"
          cat release-notes.md

      - name: Setup pnpm
        if: steps.version.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build zip
        if: steps.version.outputs.changed == 'true'
        run: pnpm zip

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body_path: release-notes.md
          generate_release_notes: true
          files: .output/opentranslator-extension-${{ steps.version.outputs.current }}-chrome.zip
          fail_on_unmatched_files: true
